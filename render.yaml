services:
  - type: web
    name: aion2026
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Set these via the Render dashboard (Sensitive):
      # DATABASE_URL, JWT_SECRET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, etc.
